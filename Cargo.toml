[package]
name = "opurom-platform"
version = "0.1.0"
edition = "2021"
description = "Opurom platform adapter ABI, capability registry and host adapters"

[dependencies]
sha2 = "0.10.9"
aes-gcm = "0.10.3"
getrandom = "0.2.15"
serde_json = "=1.0.154"

[dev-dependencies]
# Tests encode/decode PNG fixtures on every host; the library itself needs
# `png` only on macOS.
png = "0.17.16"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.52.0", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemServices",
    "Win32_UI_Input_Ime",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
png = "0.17.16"
core-graphics = "0.25.0"
objc2-avf-audio = { version = "0.3.2", default-features = false, features = [
    "AVAudioPlayer",
    "std",
] }
objc2 = { version = "0.6.5", features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSAccessibility",
    "NSAccessibilityConstants",
    "NSAccessibilityElement",
    "NSAccessibilityProtocols",
    "NSApplication",
    "NSButton",
    "NSMenu",
    "NSMenuItem",
    "NSControl",
    "NSStatusBarButton",
    "NSStatusBar",
    "NSStatusItem",
    "NSBitmapImageRep",
    "NSGraphics",
    "NSImageRep",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSView",
    "NSWindow",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "objc2-quartz-core",
    "std",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "CFData",
    "std",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "CGSession",
    "CGColorSpace",
    "CGDataProvider",
    "CGImage",
    "std",
] }
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "NSArray",
    "NSAttributedString",
    "NSDate",
    "NSDictionary",
    "NSGeometry",
    "NSNotification",
    "NSOperation",
    "NSObject",
    "NSString",
    "NSRunLoop",
    "block2",
    "objc2-core-foundation",
    "std",
] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
    "CALayer",
    "CAMetalLayer",
    "CATransaction",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "std",
] }
