[package]
name = "opurom-platform"
version = "0.1.0"
edition = "2021"
description = "OPUROM platform adapter ABI, capability registry and host adapters"

[dependencies]
png = "0.17.16"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "=0.52.0", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25.0"
objc2 = { version = "0.6.5", features = ["std"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSAccessibility",
    "NSAccessibilityConstants",
    "NSAccessibilityElement",
    "NSAccessibilityProtocols",
    "NSApplication",
    "NSBitmapImageRep",
    "NSGraphics",
    "NSImageRep",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSView",
    "NSWindow",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "objc2-quartz-core",
    "std",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "CFData",
    "std",
] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = [
    "CGSession",
    "CGColorSpace",
    "CGDataProvider",
    "CGImage",
    "std",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "NSArray",
    "NSAttributedString",
    "NSDate",
    "NSDictionary",
    "NSGeometry",
    "NSObject",
    "NSString",
    "NSRunLoop",
    "objc2-core-foundation",
    "std",
] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
    "CALayer",
    "CAMetalLayer",
    "objc2-core-foundation",
    "objc2-core-graphics",
    "std",
] }
